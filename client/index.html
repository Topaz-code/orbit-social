    <meta name="description" content="A self-hosted social network for chronological feeds, direct messaging, and voice/video calling." />
    
    <!-- Open Graph / Facebook / WhatsApp / Telegram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbit" />
    <meta property="og:url" content="https://orbit-web-6z3b.onrender.com/" />
    <meta property="og:title" content="Orbit: Break free. Stay connected." />
    <meta property="og:description" content="A self-hosted social network for chronological feeds, direct messaging, and voice/video calling." />

    <meta property="og:image:width" content="1200" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@orbit" />

    <!-- Google Fonts: Manrope (Sans) & Lora (Serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400..600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Anti-Clickjacking Frame-Busting Defense (OWASP / Zero-Trust) -->
    <style id="antiClickjack">
      html {
        display: none !important;
      }
    </style>
    <script>
      if (self === top) {
        var antiClickjack = document.getElementById("antiClickjack");
        if (antiClickjack && antiClickjack.parentNode) {
          antiClickjack.parentNode.removeChild(antiClickjack);
        }
      } else {
        top.location = self.location;
      }
    </script>
  </head>
  <body class="h-full bg-[#171A1C] text-[#D9D0B8] font-sans antialiased selection:bg-[#496D6B] selection:text-[#D9D0B8] overflow-x-hidden">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
