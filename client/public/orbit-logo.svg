<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Central Sphere -->
  <circle cx="50" cy="50" r="22" fill="url(#orbitGrad)" />
  <!-- Core Glow Accent -->
  <circle cx="43" cy="43" r="6" fill="#ffffff" opacity="0.5" />
  <!-- Elliptical Orbit Ring -->
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="url(#accentGrad)" stroke-width="4.5" transform="rotate(-30 50 50)" stroke-dasharray="180 8" />
  <!-- Satellite Planet -->
  <circle cx="82" cy="32" r="5.5" fill="#06b6d4" />
  <circle cx="80" cy="30" r="1.5" fill="#ffffff" />
</svg>
