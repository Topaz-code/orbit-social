name: Security & Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Secrets & Credential Leak Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secrets & Keys Audit
        run: |
          echo "Scanning tracked files for accidental secrets..."
          # Check for leaked private keys
          if git grep -E "(BEGIN (RSA|EC|DSA|OPENSSH)? PRIVATE KEY|service_account|private_key_id)" -- ':!*.md' ':!*.toml' ':!*.yml'; then
            echo "::error::Potential secret detected in repository files!"
            exit 1
          fi
          echo "✅ No private keys or service accounts detected in repository."
