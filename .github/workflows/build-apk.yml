name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Orbit Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Restore or inject google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > mobile/android/app/google-services.json
            echo "Successfully decoded google-services.json from GitHub Secrets."
          else
            echo "Note: Using repository local google-services.json if present."
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Grant execute permission for Gradle Wrapper
        working-directory: mobile/android
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.8
          fi
          chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
