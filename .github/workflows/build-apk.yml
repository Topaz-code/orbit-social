name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    name: Build Orbit Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package.json

      - name: Inject or Fallback google-services.json
        run: |
          mkdir -p mobile/android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > mobile/android/app/google-services.json
            echo "Successfully restored google-services.json from GitHub Secrets."
          elif [ ! -f "mobile/android/app/google-services.json" ]; then
            echo "Generating fallback google-services.json for build..."
            cat << 'EOF' > mobile/android/app/google-services.json
          {
            "project_info": {
              "project_number": "597749902093",
              "project_id": "orbit-social-c90ed",
              "storage_bucket": "orbit-social-c90ed.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:597749902093:android:dummy123456",
                  "android_client_info": {
                    "package_name": "com.orbit.social"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForBuildOnly12345"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm install --legacy-peer-deps

      - name: Generate Android debug.keystore if missing
        working-directory: mobile/android/app
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Android Debug APK
        working-directory: mobile/android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
